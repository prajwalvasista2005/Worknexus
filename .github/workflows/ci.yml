name: CI

on:
  push:
    branches: [ main, hardening ]
  pull_request:
    branches: [ main, hardening ]

jobs:
  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-dry-run:
    name: Migration Dry-Run & Safety Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: SkillSync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_dryrun_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed Messy Legacy Fixture
        env:
          DATABASE_URL: postgresql://postgres:ci_dryrun_password_12345@localhost:5432/SkillSync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_dryrun_password_12345
          POSTGRES_DB: SkillSync
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python scripts/seed_messy_fixture.py

      - name: Run Migration Dry-Run Script
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_dryrun_password_12345
          POSTGRES_DB: SkillSync
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgresql://postgres:ci_dryrun_password_12345@localhost:5432/SkillSync
        run: |
          chmod +x scripts/*.sh
          bash scripts/migration_dry_run.sh

  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: SkillSync
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Alembic Upgrade Head on Postgres
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password_12345@localhost:5432/SkillSync
          SECRET_KEY: ci_test_secret_key_32_characters_minimum_length
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password_12345@localhost:5432/SkillSync
          SECRET_KEY: ci_test_secret_key_32_characters_minimum_length
          ENVIRONMENT: test
        run: |
          PYTHONPATH=backend:. pytest backend/tests -v --cov=backend/app --cov-report=term-missing

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'new-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
